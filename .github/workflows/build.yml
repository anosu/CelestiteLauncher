name: .NET Build

on:
  push:
    branches: [ feature/add-japanese-translation ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 'feature/add-japanese-translation'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Celestite.sln

    - name: Build
      run: dotnet build Celestite.sln --configuration Release --no-restore

    - name: Publish
      run: dotnet publish Celestite.Desktop/Celestite.Desktop.csproj --configuration Release --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: celestite-desktop-app
        path: ./publish